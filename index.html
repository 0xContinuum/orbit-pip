<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Pip</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Orbit Pip - hop between crumbling planets, chain perfect landings and climb as high as you can. One tap to play!">
<meta name="theme-color" content="#120a2e">
<link rel="stylesheet" href="css/style.css">
<!-- Poki SDK: the only external request the game makes -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>
<canvas id="c" aria-label="Orbit Pip game"></canvas>

<!-- HUD buttons -->
<div id="hud" class="hidden">
  <button id="btnPause" class="round" aria-label="Pause">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <button id="btnSound" class="round" aria-label="Sound">
    <svg id="icoSoundOn" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="icoSoundOff" class="hidden" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="M16 9l5 6M21 9l-5 6"/></svg>
  </button>
</div>

<!-- Start screen -->
<div id="start" class="screen">
  <h1 id="title">Orbit Pip</h1>
  <p id="tagline" class="sub"></p>
  <button id="btnPlay" class="btn green big"></button>
  <div class="row">
    <button id="btnSkin" class="btn ghost small"></button>
  </div>
  <p id="bestStart" class="sub dim"></p>
</div>

<!-- Pause screen -->
<div id="pause" class="screen hidden">
  <h2 id="pauseTitle"></h2>
  <button id="btnResume" class="btn green big"></button>
</div>

<!-- Game over screen -->
<div id="over" class="screen hidden">
  <h2 id="overTitle"></h2>
  <div class="score-box">
    <div class="score-num" id="finalScore">0</div>
    <div class="sub" id="finalBest"></div>
    <div class="badge hidden" id="newBest"></div>
  </div>
  <div class="actions">
    <button id="btnAgain" class="btn green big"></button>
    <button id="btnRevive" class="btn purple">
      <svg class="film" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 2v2h2V7H6zm0 4v2h2v-2H6zm0 4v2h2v-2H6zm10-8v2h2V7h-2zm0 4v2h2v-2h-2zm0 4v2h2v-2h-2zM10 8v8l5-4-5-4z"/></svg>
      <span id="reviveLabel"></span>
    </button>
  </div>
</div>

<!-- Overlay while an ad is running -->
<div id="adShade" class="hidden"></div>

<script src="js/i18n.js"></script>
<script src="js/poki.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
